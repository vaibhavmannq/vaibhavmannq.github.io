# Keeps dependencies current, but never with a release younger than a week: most hijacked npm releases are caught
# and pulled within days. Minor and patch updates come together; each major version on its own, to be read first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      # Node's types follow the Node version in .nvmrc, not the newest Node.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dependencies: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
