<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vaibhav Mann. A night's walk through a coast, drawn live; portfolio in progress." />
    <meta name="theme-color" content="#1a1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Vaibhav Mann</title>
  </head>
  <body>
    <div class="poster" id="poster" aria-hidden="true"></div>
    <div class="world" id="world" aria-hidden="true"></div>
    <div class="stills" id="stills" aria-hidden="true"></div>
    <div class="veil" id="veil" aria-hidden="true"></div>

    <div class="stage" id="stage">
      <header class="masthead">
        <h1 id="name">Vaibhav Mann</h1>
        <p id="line">I build quiet, moonlit things for the web.</p>
      </header>
      <p class="place" id="place" aria-live="polite"></p>
      <nav class="rail" id="rail" aria-label="Places"></nav>
    </div>

    <div class="track" id="track" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
