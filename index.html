<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vaibhav Mann. A night's walk through a coast, drawn live; portfolio in progress." />
    <meta name="theme-color" content="#1a1220" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- stage A starts with the manifest (plan M8 Task 10): fetched with the page, not after the script runs -->
    <link rel="preload" href="/world/manifest.json" as="fetch" crossorigin />
    <title>Vaibhav Mann</title>
  </head>
  <body>
    <div class="poster" id="poster" aria-hidden="true"></div>
    <div class="world" id="world" aria-hidden="true"></div>
    <div class="stills" id="stills" aria-hidden="true"></div>
    <div class="veil" id="veil" aria-hidden="true"></div>

    <div class="stage" id="stage">
      <header class="masthead">
        <h1 id="name">Vaibhav Mann</h1>
        <p id="line">I build quiet, moonlit things for the web.</p>
        <span class="hairline" id="hairline" aria-hidden="true"></span>
      </header>
      <div class="room-glow" id="room-glow" aria-hidden="true"><div></div></div>
      <p class="room-hint" id="room-hint">Tap, click or press Enter to light the lantern</p>
      <p class="place" id="place" aria-live="polite"></p>
      <nav class="rail" id="rail" aria-label="Places"></nav>
      <div class="spots" id="spots" hidden>
        <button class="spot" type="button" data-spot="water-edge">Walk down to the water's edge</button>
        <button class="spot" type="button" data-spot="lantern">Kneel by the lantern</button>
        <button class="spot" type="button" data-spot="flowers" hidden>Lie down in the flowers</button>
        <button class="spot" type="button" data-spot="cliff-edge" hidden>Step to the edge</button>
        <button class="spot" type="button" data-spot="shallows" hidden>Wade into the shallows</button>
        <button class="spot" type="button" data-spot="rim" hidden>Walk along the rim</button>
        <button class="spot" type="button" data-spot="flats" hidden>Wade out into the flats</button>
      </div>
      <div class="spots" id="lantern-twins" hidden></div>
      <button class="ride" id="ride" type="button" hidden>Next · <span class="ride__to"></span> <span aria-hidden="true">↓</span></button>
    </div>

    <div class="track" id="track" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
